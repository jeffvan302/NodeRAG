name: M10 production SPK and simulated lifecycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m10-production-spk.yml'
      - '.dependency-cruiser.cjs'
      - '.gitignore'
      - '.gitmodules'
      - '.prettierignore'
      - '.prettierrc.json'
      - 'adapters/**'
      - 'packages/**'
      - 'platform/**'
      - 'scripts/**'
      - 'spk/**'
      - 'docker-testbed/**'
      - 'fixtures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - 'eslint.config.mjs'
      - 'LICENSE-POLICY.md'
      - 'THIRD-PARTY.md'
      - 'README.md'
      - 'docs/Implementation/checklists/m10-checklist.md'
      - 'docs/Implementation/m10-package-operations.md'
      - 'docs/Implementation/proofs/m10-proof.json'
      - 'docs/Implementation/dsm-deferred-register.md'
      - 'docs/Implementation/staged implementation.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m10-production-spk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.0
  PNPM_VERSION: 11.25.0

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm ci:quality
          pnpm repo:check

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  linux-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODERAG_M01_CPU_LIMIT: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash docker-testbed/scripts/verify-m01.sh
      - if: always()
        run: bash docker-testbed/scripts/down.sh

  production-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - id: runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: spk/generated/m10
          key: m10-dsm72-x64-postgresql-runtime-${{ hashFiles('docker-testbed/scripts/build-m10-postgres-runtime.sh', 'docker-testbed/scripts/common.sh') }}
      - name: Build twice, compare, inspect, and run the package-user lifecycle
        env:
          NODERAG_M10_REUSE_RUNTIME: ${{ steps.runtime-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          pnpm package:candidate
          first_sha="$(sha256sum spk/artifacts/noderag-0.2.0-1-x86_64-production.spk | awk '{print $1}')"
          pnpm package:candidate
          second_sha="$(sha256sum spk/artifacts/noderag-0.2.0-1-x86_64-production.spk | awk '{print $1}')"
          test "${first_sha}" = "${second_sha}"
          NODERAG_M10_REUSE_RUNTIME=1 pnpm package:runtime
          pnpm package:candidate:verify
