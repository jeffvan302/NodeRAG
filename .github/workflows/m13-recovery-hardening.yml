name: M13 recovery and security hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m13-recovery-hardening.yml'
      - '.dockerignore'
      - 'packages/**'
      - 'platform/**'
      - 'scripts/**'
      - 'spk/**'
      - 'docker-testbed/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - 'eslint.config.mjs'
      - 'THIRD-PARTY.md'
      - 'docs/Implementation/checklists/m13-checklist.md'
      - 'docs/Implementation/m13-recovery-operations.md'
      - 'docs/Implementation/proofs/m13-proof.json'
      - 'docs/Implementation/dsm-deferred-register.md'
      - 'docs/Implementation/staged implementation.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m13-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.0
  PNPM_VERSION: 11.25.0

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Validate source, recovery contracts, SBOM, licenses, and security
        run: |
          pnpm ci:quality
          pnpm recovery:m13:matrix
          pnpm repo:check

  recovery-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Run the complete PostgreSQL integration regression
        run: pnpm test:integration

  postgres-major-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Rehearse PostgreSQL 16 to 17 restore and retained-source rollback
        run: bash docker-testbed/scripts/verify-m13.sh --upgrade-only

  thin-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Build twice and verify the recovery-enabled package payload
        run: |
          pnpm package:thin
          first_sha="$(sha256sum spk/artifacts/noderag-1.0.0-rc.1-x86_64-thin.spk | awk '{print $1}')"
          pnpm package:thin
          second_sha="$(sha256sum spk/artifacts/noderag-1.0.0-rc.1-x86_64-thin.spk | awk '{print $1}')"
          test "${first_sha}" = "${second_sha}"
          pnpm package:verify
