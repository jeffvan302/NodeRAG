name: M14 immutable testbed release candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m14-release-candidate.yml'
      - '.dependency-cruiser.cjs'
      - '.dockerignore'
      - '.gitignore'
      - '.gitmodules'
      - '.prettierignore'
      - '.prettierrc.json'
      - 'adapters/**'
      - 'packages/**'
      - 'platform/**'
      - 'scripts/**'
      - 'spk/**'
      - 'docker-testbed/**'
      - 'fixtures/**'
      - 'docs/Implementation/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - 'eslint.config.mjs'
      - 'LICENSE-POLICY.md'
      - 'THIRD-PARTY.md'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m14-release-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.0
  PNPM_VERSION: 11.25.0
  NODERAG_COMMIT_SHA: ${{ github.sha }}

jobs:
  freeze-and-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Prove the clean checkout contains no untracked build input
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Verify release freeze and complete quality/security suite
        run: |
          pnpm release:freeze:verify
          pnpm ci:quality
          pnpm recovery:m13:matrix
          pnpm repo:check
          git diff --exit-code

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Run the complete PostgreSQL/pgvector integration regression
        run: pnpm test:integration

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @noderag/ui exec playwright install --with-deps chromium
      - name: Run setup, operator, destructive-action, responsive, and accessibility journeys
        run: pnpm test:e2e

  evaluation-and-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Enforce the frozen evaluation corpus and deterministic quality thresholds
        run: pnpm evaluation:m12
      - name: Rehearse encrypted recovery and PostgreSQL 16 to 17 retained-source rollback
        run: bash docker-testbed/scripts/verify-m13.sh --docker

  production-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - id: runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: spk/generated/m10
          key: m14-dsm72-x64-postgresql-runtime-${{ hashFiles('docker-testbed/scripts/build-m10-postgres-runtime.sh', 'docker-testbed/scripts/common.sh') }}
      - name: Build twice, compare, inspect, and execute the exact package lifecycle
        env:
          NODERAG_M10_REUSE_RUNTIME: ${{ steps.runtime-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          build_candidate() {
            for attempt in 1 2 3; do
              if pnpm package:candidate; then return 0; fi
              if [ "${attempt}" = 3 ]; then return 1; fi
              sleep "$((attempt * 15))"
            done
          }
          build_candidate
          first_sha="$(sha256sum spk/artifacts/noderag-1.0.0-45-x86_64.spk | awk '{print $1}')"
          build_candidate
          second_sha="$(sha256sum spk/artifacts/noderag-1.0.0-45-x86_64.spk | awk '{print $1}')"
          test "${first_sha}" = "${second_sha}"
          NODERAG_M10_REUSE_RUNTIME=1 pnpm package:runtime
          pnpm package:candidate:verify
          runtime_sha="$(sha256sum spk/generated/m10/postgresql-runtime.tar.gz | awk '{print $1}')"
          runtime_sidecar_sha="$(awk '{print $1}' spk/generated/m10/postgresql-runtime.tar.gz.sha256)"
          test "${runtime_sha}" = "${runtime_sidecar_sha}"
          test "$(sha256sum spk/artifacts/noderag-1.0.0-45-x86_64.spk | awk '{print $1}')" = \
            "${second_sha}"
          printf 'Release-candidate SPK SHA-256: %s\n' "${second_sha}"
          printf 'Bundled PostgreSQL runtime SHA-256: %s\n' "${runtime_sha}"
          git diff --exit-code
      - name: Assemble immutable private prerelease assets
        run: |
          mkdir -p spk/artifacts/m14-release
          cp spk/artifacts/noderag-1.0.0-45-x86_64.spk* spk/artifacts/m14-release/
          cp platform/sbom.spdx.json platform/release-candidate.v1.json \
            platform/release-freeze.v1.json THIRD-PARTY.md spk/artifacts/m14-release/
          cp docs/Implementation/release/1.0.0-rc.1-release-notes.md \
            docs/Implementation/proofs/m14-proof.json \
            docs/Implementation/checklists/dsm-final-checklist.md spk/artifacts/m14-release/
      - name: Upload exact release-candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noderag-1.0.0-rc.1-${{ github.sha }}
          path: spk/artifacts/m14-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
