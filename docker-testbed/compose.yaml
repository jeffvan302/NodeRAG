name: noderag-testbed

services:
  postgres:
    image: ${NODERAG_TESTBED_POSTGRES_IMAGE:-pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f}
    restart: "no"
    environment:
      POSTGRES_DB: ${NODERAG_TESTBED_POSTGRES_DB:-noderag_test}
      POSTGRES_USER: ${NODERAG_TESTBED_POSTGRES_USER:-noderag_test}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${NODERAG_TESTBED_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  m01-node:
    build:
      context: .
      dockerfile: m01/node/Dockerfile
    profiles:
      - m01
    mem_limit: ${NODERAG_M01_MEMORY_LIMIT:-8g}
    cpus: ${NODERAG_M01_CPU_LIMIT:-12}
    user: "node:node"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODERAG_M01_MODEL_ROOT: /models/qwen3-embedding-0.6b/bd58e9fd4b0467770da53678d8da25481c0f959b
      NODERAG_M01_FIXTURE_ROOT: /workspace/fixtures/formats
      NODERAG_M01_OLLAMA_URL: ${NODERAG_M01_OLLAMA_URL:-http://host.docker.internal:11434}
      NODERAG_M01_OLLAMA_MODEL: ${NODERAG_M01_OLLAMA_MODEL:-}
      NODERAG_M01_OLLAMA_PARALLEL: ${NODERAG_M01_OLLAMA_PARALLEL:-1}
      NODERAG_M01_CONTENT_MAY_LEAVE_LAN: ${NODERAG_M01_CONTENT_MAY_LEAVE_LAN:-false}
    extra_hosts:
      - host.docker.internal:host-gateway
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    volumes:
      - ./runtime/models:/models:ro
      - ../fixtures:/workspace/fixtures:ro
      - m01-storage:/probe-volume
    networks:
      - backend

secrets:
  postgres_password:
    file: ./.secrets/postgres_password

volumes:
  postgres-data:
  m01-storage:

networks:
  backend:
    driver: bridge
